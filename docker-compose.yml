services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-friday}
      POSTGRES_DB: ${POSTGRES_DB:-friday}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 只綁定 127.0.0.1：db 只給同機的其他 container / 本機工具（如 psql、MCP）連線，
      # 不對區網開放，避免同一 Wi-Fi 上的其他裝置也能連到本機 Postgres。
      # 這個「非 0.0.0.0」的習慣要帶進 Phase 1 的 AWS SG／VPC 設計：RDS 一樣不能公開。
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-friday}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # 同上：只綁 127.0.0.1，redis 沒有密碼保護，不該讓區網內其他裝置連得到。
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-friday}:${POSTGRES_PASSWORD:-friday}@db:5432/${POSTGRES_DB:-friday}
      REDIS_URL: redis://redis:6379
      # 瀏覽器打 api 時帶的 Origin 會是 frontend 對外映射的 port，CORS 允許清單要跟這裡對齊。
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build: ./agent
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./agent:/app
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3001}
      VITE_APP_NAME: ${APP_NAME:-Friday}
    ports:
      - "${FRONTEND_PORT:-8080}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db-data:
