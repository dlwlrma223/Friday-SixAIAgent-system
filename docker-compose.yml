services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-friday}
      POSTGRES_DB: ${POSTGRES_DB:-friday}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # localhost-only: no LAN exposure for local Postgres (same principle as RDS not being public).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-friday}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # localhost-only: redis has no auth, don't expose it to the LAN.
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      # ECR/ECS builds omit --target and get the Dockerfile's last stage (production).
      target: dev
    environment:
      PORT: 3001
      # Same variable names as the ECS task definition, so app code has one code path.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-friday}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-friday}
      DB_NAME: ${POSTGRES_DB:-friday}
      DB_SSL: disable
      REDIS_URL: redis://redis:6379
      # Must match the origin the browser sends when hitting api (frontend's mapped port).
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build: ./agent
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./agent:/app
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3001}
      VITE_APP_NAME: ${APP_NAME:-Friday}
    ports:
      - "${FRONTEND_PORT:-8080}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db-data:
