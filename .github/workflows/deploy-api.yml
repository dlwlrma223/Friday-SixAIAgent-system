name: Deploy API to ECS

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"

# id-token: write is required for the OIDC handshake with AWS.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::270068815816:role/github-actions-friday-deploy
          aws-region: ap-southeast-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ECS Fargate task runs on ARM64, but this runner is amd64 —
      # QEMU + buildx cross-compiles the image for the right architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/friday-api:latest

      # Task definition points at the ":latest" tag, so forcing a new
      # deployment is enough to pick up the image just pushed above.
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster friday-cluster \
            --service friday-api-service \
            --force-new-deployment
